# ===== Server =====
server.port=8080

# ===== MySQL =====
spring.datasource.url=jdbc:mysql://localhost:3306/cryptosim_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===== Redis =====
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ===== JWT =====
jwt.secret=cryptosim-super-secret-key-change-in-production-min-256-bits
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ===== Price Feed =====
binance.websocket.url=wss://stream.binance.com:9443/ws
coinbase.api.url=https://api.coinbase.com/v2/prices
price.staleness.threshold.ms=10000

# ===== App =====
spring.application.name=CryptoSim Pro